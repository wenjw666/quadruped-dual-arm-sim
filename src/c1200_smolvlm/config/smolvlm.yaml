c1200_smolvlm_camera:
  ros__parameters:
    source: topic
    input_topic: /camera/image_raw
    input_reliability: reliable
    output_topic: /smolvlm/image
    device: /dev/video4
    width: 640
    height: 480
    fps: 10.0
    frame_id: camera_color_optical_frame

c1200_smolvlm:
  ros__parameters:
    image_topic: /smolvlm/image
    prompt_topic: /smolvlm/prompt
    response_topic: /smolvlm/response
    status_topic: /smolvlm/status
    backend: server
    server_url: http://127.0.0.1:8088/v1/chat/completions
    runner: /userdata/smolvlm/build/bin/llama-mtmd-cli
    model: /userdata/smolvlm/models/SmolVLM-500M-Instruct-Q8_0.gguf
    mmproj: /userdata/smolvlm/models/mmproj-SmolVLM-500M-Instruct-Q8_0.gguf
    threads: 8
    context: 2048
    max_tokens: 128
    timeout_sec: 120.0
    offload_mmproj: false
